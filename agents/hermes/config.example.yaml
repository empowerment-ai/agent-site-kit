# Snippets to merge into ~/.hermes/config.yaml. This is not a complete config;
# run `hermes setup` first, then add what you need from here.

skills:
  # Load this repo's skills directly (updates arrive with `git pull` in ~/sites/site)
  external_dirs:
    - ~/sites/site/skills

terminal:
  # Hermes hides environment variables from commands by default. The site-care
  # scripts need the GitHub token (the site-care skill also declares it).
  env_passthrough:
    - GITHUB_TOKEN

approvals:
  mode: smart            # ask in chat before commands Hermes classifies as dangerous
  cron_mode: deny        # scheduled jobs can't run dangerous commands, so the checkup only reports

# DataForSEO for the seo-checkup skill. Hermes only passes the env you list here to
# an MCP server. This file lives only on your server; never commit real values.
mcp_servers:
  dataforseo:
    command: npx
    # Pinned on purpose: this process runs with your DataForSEO credentials, so don't
    # let it auto-update. Bump the version deliberately after reading the changelog.
    args: ["-y", "dataforseo-mcp-server@2.9.13"]
    env:
      DATAFORSEO_USERNAME: "your-dataforseo-login"
      DATAFORSEO_PASSWORD: "your-dataforseo-api-password"
      ENABLED_MODULES: "KEYWORDS_DATA,DATAFORSEO_LABS"   # keyword research only
    tools:
      # Only these four read-only research tools are visible to the agent.
      # (An empty include list would expose every tool the server offers.)
      include:
        - dataforseo_labs_google_keyword_ideas
        - dataforseo_labs_google_keyword_suggestions
        - kw_data_google_ads_search_volume
        - dataforseo_labs_google_ranked_keywords
